[project]
name = "personal-tutor-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2,<3",
    "pydantic>=2,<3",
    "python-multipart>=0.0.9",
    "pypdf>=5,<7",
    "torch>=2.2,<3",
    "sentence-transformers>=3,<6",
    "langgraph>=0.3,<2",
    "openai>=1.75,<3",
    "python-dotenv>=1,<2",
    "fonttools>=4.68.0",
    "pymupdf>=2.1",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
